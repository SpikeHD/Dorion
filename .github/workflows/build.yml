name: Build

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'src-tauri/**/*'
      - 'src/**/*'
      - 'updater/**/*'
    branches:
      - main
  pull_request:
    paths:
      - '.github/workflows/build.yml'
      - 'package.json'
      - 'src-tauri/**/*'
      - 'src/**/*'
      - 'updater/**/*'

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  GIT_HASH: ${{ github.sha }}

jobs:
  build:
    name: Build (${{ matrix.config.target }})
    runs-on: ${{ matrix.config.platform }}

    strategy:
      fail-fast: false
      matrix:
        config:
          - platform: ubuntu-22.04
            target: 'x86_64-unknown-linux-gnu'
          - platform: ubuntu-22.04
            target: 'aarch64-unknown-linux-gnu'

          - platform: macos-latest
            target: 'x86_64-apple-darwin'
          - platform: macos-latest
            target: 'aarch64-apple-darwin'

          - platform: windows-latest
            target: 'x86_64-pc-windows-msvc'
          - platform: windows-latest
            target: 'aarch64-pc-windows-msvc'

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.config.target }}

      - name: (Non-Linux) Build updater
        if: matrix.config.platform != 'ubuntu-22.04'
        run: pnpm build:updater
        env:
          RUSTFLAGS: -Awarnings

      - name: Install dependencies
        run: pnpm install && pnpm shupdate

      - name: Compile
        if: matrix.config.platform != 'ubuntu-22.04'
        run: pnpm tauri build --no-bundle --target ${{ matrix.config.target }}
        env:
          RUSTFLAGS: -Awarnings

      - name: (Linux) (x86_64) Compile
        if: matrix.config.target == 'x86_64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json --no-bundle --target ${{ matrix.config.target }} -- --config target.x86_64-unknown-linux-gnu.linker=\'x86_64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion

      - name: (Linux) (ARM64) Compile
        if: matrix.config.target == 'aarch64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json --no-bundle --target ${{ matrix.config.target }} -- --config target.aarch64-unknown-linux-gnu.linker=\'aarch64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/lib/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          ZSTD_SYS_USE_PKG_CONFIG: 1
          ZSTD_SYS_NO_VENDOR: 1

      - name: (Linux) Stage CEF
        if: matrix.config.platform == 'ubuntu-22.04'
        run: bash scripts/bundle-cef.sh

      # Make empty folders for plugins and themes
      - name: (Windows) Create empty folders for plugins
        if: matrix.config.platform == 'windows-latest'
        continue-on-error: true
        run: mkdir src-tauri/target/${{ matrix.config.target }}/release/themes && mkdir src-tauri/target/${{ matrix.config.target }}/release/plugins

      # Empty folders, unix edition
      - name: (Unix) Create empty folders for plugins and themes
        if: matrix.config.platform != 'windows-latest'
        run: mkdir -p src-tauri/target/${{ matrix.config.target }}/release/plugins && mkdir -p src-tauri/target/${{ matrix.config.target }}/release/themes

      - name: Create .portable file for portable builds
        run: cd src-tauri/target/${{ matrix.config.target }}/release && touch .portable

      - name: (Windows) Compress build
        if: matrix.config.platform == 'windows-latest'
        run: cd src-tauri/target/${{ matrix.config.target }}/release && 7z a -tzip -mx9 Dorion.zip
          Dorion.exe
          updater.exe
          .portable
          plugins/
          themes/
          icons/
          injection/
          extension/

      - name: (Linux) Compress build
        if: matrix.config.platform == 'ubuntu-22.04'
        run: |
          cd src-tauri/target/${{ matrix.config.target }}/release
          rm -rf locales
          cp -af ../../../.cef/. .
          tar -czvf dorion.tar.gz Dorion .portable ./plugins ./themes ./injection ./icons libcef.so libEGL.so libGLESv2.so chrome_100_percent.pak chrome_200_percent.pak resources.pak icudtl.dat v8_context_snapshot.bin chrome-sandbox locales

      # Windows portable
      - name: (Windows) Upload portable
        if: matrix.config.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.config.target }}-portable
          path: src-tauri/target/${{ matrix.config.target }}/release/Dorion.zip

      # Ubuntu portable
      - name: (Linux) Upload portable
        if: matrix.config.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.config.target }}-portable
          path: src-tauri/target/${{ matrix.config.target }}/release/dorion.tar.gz

  # Package jobs
  bundle-linux-deb:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}

      - run: pnpm install

      - name: Package .deb (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles deb --target ${{ matrix.target }} -- --config target.x86_64-unknown-linux-gnu.linker=\'x86_64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion

      - name: Package .deb (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles deb --target ${{ matrix.target }} -- --config target.aarch64-unknown-linux-gnu.linker=\'aarch64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/lib/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          ZSTD_SYS_USE_PKG_CONFIG: 1
          ZSTD_SYS_NO_VENDOR: 1

      - name: Upload .deb
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.target }}-deb
          path: src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  bundle-linux-rpm:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}

      - run: pnpm install

      - name: Package .rpm (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles rpm --target ${{ matrix.target }} -- --config target.x86_64-unknown-linux-gnu.linker=\'x86_64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion

      - name: Package .rpm (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles rpm --target ${{ matrix.target }} -- --config target.aarch64-unknown-linux-gnu.linker=\'aarch64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/lib/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          ZSTD_SYS_USE_PKG_CONFIG: 1
          ZSTD_SYS_NO_VENDOR: 1

      - name: Upload .rpm
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.target }}-rpm
          path: src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm

  bundle-linux-appimage:
    needs: build
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: ['x86_64-unknown-linux-gnu', 'aarch64-unknown-linux-gnu']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}

      - run: pnpm install

      - name: Package AppImage (x86_64)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles appimage --target ${{ matrix.target }} -- --config target.x86_64-unknown-linux-gnu.linker=\'x86_64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion

      - name: Package AppImage (ARM64)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: pnpm tauri build -c src-tauri/tauri.linux.conf.json -c '{"build":{"beforeBuildCommand":""}}' --bundles appimage --target ${{ matrix.target }} -- --config target.aarch64-unknown-linux-gnu.linker=\'aarch64-linux-gnu-gcc\'
        env:
          RUSTFLAGS: -Awarnings -L/usr/lib/aarch64-linux-gnu -C link-arg=-Wl,--disable-new-dtags -C link-arg=-Wl,-rpath,$ORIGIN -C link-arg=-Wl,-rpath,$ORIGIN/../lib/dorion
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          PKG_CONFIG_SYSROOT_DIR: /usr/lib/aarch64-linux-gnu
          PKG_CONFIG_PATH: /usr/lib/aarch64-linux-gnu/pkgconfig
          ZSTD_SYS_USE_PKG_CONFIG: 1
          ZSTD_SYS_NO_VENDOR: 1

      - name: Upload .appimage
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.target }}-appimage
          path: src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage

  bundle-windows:
    needs: build
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        bundle: [msi, nsis]
        target: ['x86_64-pc-windows-msvc', 'aarch64-pc-windows-msvc']
        # Windows ARM only supports NSIS right now, but we should keep the MSI
        # for x86_64, a buncha package managers will explode otherwise
        exclude:
          - bundle: msi
            target: aarch64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}

      - run: pnpm install

      - name: Build updater
        run: pnpm build:updater
        env:
          RUSTFLAGS: -Awarnings

      - name: Package ${{ matrix.bundle }}
        run: pnpm tauri build -c '{"build":{"beforeBuildCommand":""}}' --bundles ${{ matrix.bundle }} --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -Awarnings

      - name: Upload bundle
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.target }}-${{ matrix.bundle }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/${{ matrix.bundle }}/*

  bundle-macos:
    needs: build
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target: ['x86_64-apple-darwin', 'aarch64-apple-darwin']
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-build
        with:
          target: ${{ matrix.target }}

      - run: pnpm install

      - name: Build updater
        run: pnpm build:updater
        env:
          RUSTFLAGS: -Awarnings

      - name: Package .dmg
        run: pnpm tauri build -c '{"build":{"beforeBuildCommand":""}}' --bundles dmg --target ${{ matrix.target }}
        env:
          RUSTFLAGS: -Awarnings

      - name: Upload .dmg
        uses: actions/upload-artifact@v7
        with:
          name: dorion-${{ matrix.target }}-dmg
          path: src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  flatpak:
    # Flatpak just needs the deb to extract
    needs: bundle-linux-deb
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-51
      options: --privileged
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/download-artifact@v8
        with:
          name: dorion-x86_64-unknown-linux-gnu-deb
          path: flatpak/build

      - name: (Flatpak) Stage the deb
        run: mv flatpak/build/*.deb flatpak/build/dorion-x86_64.deb

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: com.spikehd.dorion.flatpak
          manifest-path: flatpak/com.spikehd.dorion.yml
          cache: false
          upload-artifact: true
          artifact-name: dorion-x86_64-unknown-linux-gnu-flatpak

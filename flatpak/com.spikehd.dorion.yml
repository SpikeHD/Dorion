app-id: com.spikehd.dorion
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk

command: /app/usr/bin/Dorion

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # tauri resolves resources from ${APPDIR}/usr/lib/Dorion
  - --env=APPDIR=/app

modules:
  - shared-modules/libayatana-appindicator/libayatana-appindicator-gtk3.json
  - name: dorion
    buildsystem: simple
    build-commands:
      # The deb bundles the layout tauri resolves resources from already
      - ar x dorion.deb
      - tar -xf data.tar.gz
      - mkdir -p ${FLATPAK_DEST}/usr
      - cp -a usr/bin usr/lib ${FLATPAK_DEST}/usr/
      # The deb's desktop file and icon point at /usr/bin which isn't the same here
      - install -Dm0644 com.spikehd.dorion.desktop ${FLATPAK_DEST}/share/applications/com.spikehd.dorion.desktop
      - install -Dm0644 com.spikehd.dorion.metainfo.xml ${FLATPAK_DEST}/share/metainfo/com.spikehd.dorion.metainfo.xml
      - install -Dm0644 icon-512.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/com.spikehd.dorion.png
      - install -Dm0644 icon-128.png ${FLATPAK_DEST}/share/icons/hicolor/128x128/apps/com.spikehd.dorion.png
    sources:
      - type: file
        path: build/dorion-x86_64.deb
        dest-filename: dorion.deb
        only-arches: [x86_64]
      - type: file
        path: build/dorion-arm64.deb
        dest-filename: dorion.deb
        only-arches: [aarch64]
      - type: file
        path: com.spikehd.dorion.desktop
      - type: file
        path: com.spikehd.dorion.metainfo.xml
      - type: file
        path: ../src-tauri/icons/icon.png
        dest-filename: icon-512.png
      - type: file
        path: ../src-tauri/icons/128x128.png
        dest-filename: icon-128.png
